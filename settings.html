<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ajustes — Premier Nutri ERP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script type="module">
    import { requireAuth } from './assets/auth.js';
    import { renderShell } from './assets/layout.js';
    const session = await requireAuth();
    if (!session) throw new Error('no session');
    const root = renderShell({ active: 'settings', session });
    root.innerHTML = `
      <div class="page-header"><h1>Ajustes</h1></div>
      <div class="card empty">Em construção — próximo módulo.</div>
    `;
  </script>
</body>
</html>
